name: Sync from GitLab

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add GitLab remote and fetch
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TO_GITHUB_CLONES }}
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/ente76/guillotine.git
          git fetch gitlab

      - name: Merge GitLab changes
        run: |
          git merge gitlab/main --allow-unrelated-histories --no-edit || true

      - name: Push to GitHub
        run: |
          git push origin main
